<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe do ninja</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --line: #2a3a4f;
            --text: #e8eef6;
            --muted: #93a4b8;
            --accent: #3dd6c6;
            --view: #3b82f6;
            --edit: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Inter, system-ui, sans-serif;
            background:
                    radial-gradient(1200px 500px at 10% -10%, #16324a 0%, transparent 55%),
                    radial-gradient(900px 400px at 100% 0%, #1b3a2e 0%, transparent 50%),
                    var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        .card {
            max-width: 760px;
            margin: 0 auto;
            background: rgba(26, 35, 50, 0.92);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        .topo {
            display: flex;
            gap: 24px;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .topo img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid var(--line);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.75rem;
            letter-spacing: 0.02em;
        }
        .id {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0;
        }
        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(61, 214, 198, 0.15);
            color: var(--accent);
        }
        dl {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px 16px;
            margin: 0 0 28px;
        }
        dt {
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding-top: 4px;
        }
        dd {
            margin: 0;
            font-size: 1rem;
        }
        .acoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }
        .btn-view { background: var(--view); }
        .btn-edit { background: var(--edit); color: #1a1408; }
        .btn-delete { background: var(--danger); }
    </style>
</head>
<body>
<div class="card" th:object="${ninja}">
    <div class="topo">
        <img th:src="*{imgUrl}" alt="Foto do ninja">
        <div>
            <h1 th:text="*{nome}">Nome do ninja</h1>
            <p class="id">ID <span th:text="*{id}">1</span></p>
            <span class="badge" th:text="*{nivel}">Nível</span>
        </div>
    </div>
    <dl>
        <dt>Idade</dt>
        <dd th:text="*{idade}">0</dd>
        <dt>Email</dt>
        <dd th:text="*{email}">email@exemplo.com</dd>
        <dt>Missão</dt>
        <dd th:text="*{missao?.nome} ?: 'Sem missão'">Sem missão</dd>
    </dl>
    <div class="acoes">
        <a class="btn btn-view" th:href="@{/ninjas/ui/listar}">Voltar</a>
        <a class="btn btn-edit" th:href="@{/ninjas/ui/alterar/{id}(id=*{id})}">Alterar</a>
        <a class="btn btn-delete" th:href="@{/ninjas/ui/deletar/{id}(id=*{id})}">Deletar</a>
    </div>
</div>
</body>
</html>
