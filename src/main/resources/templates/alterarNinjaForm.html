<!
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>Alterar Ninja</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --line: #2a3a4f;
            --text: #e8eef6;
            --muted: #93a4b8;
            --accent: #3dd6c6;
            --edit: #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Inter, system-ui, sans-serif;
            background:
                    radial-gradient(1200px 500px at 10% -10%, #16324a 0%, transparent 55%),
                    radial-gradient(900px 400px at 100% 0%, #1b3a2e 0%, transparent 50%),
                    var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        .topo {
            max-width: 560px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0.02em;
        }
        .voltar {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .voltar:hover { color: var(--text); }
        .card {
            max-width: 560px;
            margin: 0 auto;
            background: rgba(26, 35, 50, 0.92);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        .campo {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #141c29;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.12s ease;
        }
        input:focus, select:focus {
            border-color: var(--accent);
        }
        input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .linha-dupla {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .acoes-form {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }
        .btn-salvar { background: var(--edit); color: #1a1408; }
        .btn-cancelar { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    </style>
</head>

<body>
<div class="topo">
    <h1>Alterar ninja</h1>
    <a class="voltar" th:href="@{/ninjas/ui/listar}">&larr; Voltar</a>
</div>

<div class="card">
    <form th:action="@{/ninjas/ui/alterarID/{id}(id=${ninja.id})}" th:object="${ninja}" method="post">

        <div class="campo">
            <label for="id">ID</label>
            <input type="text" id="id" th:field="*{id}" disabled>
        </div>

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Sakura" required>
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="ninja@konoha.com" required>
        </div>

        <div class="linha-dupla">
            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade" th:field="*{idade}" placeholder="18" min="0" required>
            </div>
            <div class="campo">
                <label for="nivel">Nível</label>
                <select id="nivel" th:field="*{nivel}">
                    <option value="Genin">Genin</option>
                    <option value="Chunin">Chunin</option>
                    <option value="Jounin">Jounin</option>
                    <option value="KAGE">Kage</option>
                </select>
            </div>
        </div>

        <div class="campo">
            <label for="imgUrl">URL da imagem</label>
            <input type="text" id="imgUrl" th:field="*{imgUrl}" placeholder="http://img.com/foto.png">
        </div>

        <div class="campo">
            <label for="missaoId">Missão</label>
            <select id="missaoId" name="missaoId">
                <option value="">-- Nenhuma --</option>
                <option th:each="m : ${missoes}"
                        th:value="${m.id}"
                        th:text="${m.nome}"
                        th:selected="${ninja.missao != null and ninja.missao.id == m.id}"></option>
            </select>
        </div>

        <div class="acoes-form">
            <a class="btn btn-cancelar" th:href="@{/ninjas/ui/listar}">Cancelar</a>
            <button type="submit" class="btn btn-salvar">Salvar alterações</button>
        </div>

    </form>
</div>
</body>
</html>
