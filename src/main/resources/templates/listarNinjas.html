<!
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>Tabela de Ninjas</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --line: #2a3a4f;
            --text: #e8eef6;
            --muted: #93a4b8;
            --accent: #3dd6c6;
            --view: #3b82f6;
            --edit: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Inter, system-ui, sans-serif;
            background:
                    radial-gradient(1200px 500px at 10% -10%, #16324a 0%, transparent 55%),
                    radial-gradient(900px 400px at 100% 0%, #1b3a2e 0%, transparent 50%),
                    var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        h1 {
            margin: 0 0 24px;
            font-size: 1.75rem;
            letter-spacing: 0.02em;
        }
        .card {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(26, 35, 50, 0.92);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 860px;
        }
        thead th {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            padding: 14px 12px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }
        tbody tr {
            transition: background 0.15s ease;
        }
        tbody tr:hover {
            background: rgba(61, 214, 198, 0.06);
        }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
            font-size: 0.95rem;
        }
        td img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--line);
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(61, 214, 198, 0.15);
            color: var(--accent);
        }
        .acoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }
        .btn-view { background: var(--view); }
        .btn-edit { background: var(--edit); color: #1a1408; }
        .btn-delete { background: var(--danger); }
    </style>
</head>

<body>
<div class="card">
    <h1>Lista de ninjas</h1>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Imagem</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Nível</th>
            <th>Email</th>
            <th>Missões</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ninja : ${ninjas}">
            <td th:text="${ninja.id}"></td>
            <td>
                <img th:src="${ninja.imgUrl}" width="100" height="100" alt="Foto do ninja">
            </td>
            <td th:text="${ninja.nome}"></td>
            <td th:text="${ninja.idade}"></td>
            <td>
                <span class="badge" th:text="${ninja.nivel}"></span>
            </td>
            <td th:text="${ninja.email}"></td>
            <td th:text="${ninja.missao?.nome}"></td>
            <td>
                <div class="acoes">
                    <a class="btn btn-view"
                       th:href="@{/ninjas/ui/listarID/{id}(id=${ninja.id})}">Ver detalhes</a>
                    <a class="btn btn-edit"
                       th:href="@{/ninjas/ui/alterar/{id}(id=${ninja.id})}">Alterar</a>
                    <a class="btn btn-delete"
                       th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}">Deletar</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
